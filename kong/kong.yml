_format_version: "3.0"
_transform: true

# Service = destino (a dónde va la petición). Se resuelve por nombre DNS de Docker.
# Route   = criterio de coincidencia (qué peticiones públicas se asignan al Service).
services:
  - name: svc-estudiantes
    url: http://estudiantes:3000/estudiantes
    routes:
      - name: route-estudiantes
        paths: [/api/estudiantes]
        methods: [GET]
        strip_path: true

  - name: svc-matriculas
    url: http://matriculas:3000/matriculas
    routes:
      - name: route-matriculas
        paths: [/api/matriculas]
        methods: [GET]
        strip_path: true

  - name: svc-pagos
    url: http://pagos:3000/pagos
    routes:
      - name: route-pagos
        paths: [/api/pagos]
        methods: [GET]
        strip_path: true

# Reto 2 - Autenticación por API Key (plugin global: toda ruta queda protegida por defecto).
# Cabecera de la credencial: apikey. No se reenvía a los backends.
plugins:
  - name: key-auth
    config:
      key_names: [apikey]
      hide_credentials: true

  # Reto 3 - Rate limiting: 5 solicitudes/minuto por consumidor.
  # Alcance: global (contador compartido entre /api/estudiantes, /matriculas y /pagos
  # para cada consumidor). policy=local: contador en memoria de ESTA instancia de Kong.
  - name: rate-limiting
    config:
      minute: 5
      limit_by: consumer
      policy: local
      fault_tolerant: true
      hide_client_headers: false

# Consumidor FICTICIO de prueba. La clave es de demostración, no un secreto real.
consumers:
  - username: app-externa-demo
    keyauth_credentials:
      - key: demo-key-educonnect-2026
