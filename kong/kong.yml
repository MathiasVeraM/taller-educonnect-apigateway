_format_version: "3.0"
_transform: true

# Service = destino (a dónde va la petición). Se resuelve por nombre DNS de Docker.
# Route   = criterio de coincidencia (qué peticiones públicas se asignan al Service).
services:
  - name: svc-estudiantes
    url: http://estudiantes:3000/estudiantes
    routes:
      - name: route-estudiantes
        paths: [/api/estudiantes]
        methods: [GET]
        strip_path: true

  - name: svc-matriculas
    url: http://matriculas:3000/matriculas
    routes:
      - name: route-matriculas
        paths: [/api/matriculas]
        methods: [GET]
        strip_path: true

  - name: svc-pagos
    url: http://pagos:3000/pagos
    routes:
      - name: route-pagos
        paths: [/api/pagos]
        methods: [GET]
        strip_path: true
