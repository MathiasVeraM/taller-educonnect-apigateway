name: educonnect

x-mock: &mock
  build: ./mocks
  restart: unless-stopped
  networks: [educonnect-net]
  # Sin "ports": los backends solo son alcanzables dentro de la red Docker.

services:
  estudiantes:
    <<: *mock
    environment: { SERVICE: estudiantes, PORT: "3000" }

  matriculas:
    <<: *mock
    environment: { SERVICE: matriculas, PORT: "3000" }

  pagos:
    <<: *mock
    environment: { SERVICE: pagos, PORT: "3000" }

  kong:
    image: kong:3.9.1   # versión fijada (ver docs/ENTREGABLES.md)
    restart: unless-stopped
    networks: [educonnect-net]
    environment:
      KONG_DATABASE: "off"                          # modo DB-less
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro
    ports:
      - "8080:8000"             # único punto de entrada público (proxy): host 8080 -> Kong 8000
      - "127.0.0.1:8001:8001"   # Admin API solo en localhost
    depends_on: [estudiantes, matriculas, pagos]

networks:
  educonnect-net:
    driver: bridge
